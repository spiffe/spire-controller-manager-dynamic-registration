# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    main: ./cmd/spire-controller-manager-dynamic-registration-agent
    binary: spire-controller-manager-dynamic-registration-agent
    id: spire-controller-manager-dynamic-registration-agent
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    main: ./cmd/spire-controller-manager-dynamic-registration-server
    binary: spire-controller-manager-dynamic-registration-server
    id: spire-controller-manager-dynamic-registration-server

archives:
  - format: tar.gz
    builds:
      - spire-controller-manager-dynamic-registration-agent
    id: spire-controller-manager-dynamic-registration-agent
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      spire-controller-manager-dynamic-registration-agent_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip
  - format: tar.gz
    builds:
      - spire-controller-manager-dynamic-registration-server
    id: spire-controller-manager-dynamic-registration-server
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      spire-controller-manager-dynamic-registration-server_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

kos:
  - id: "spire-controller-manager-dynamic-registration-agent"
    build: "spire-controller-manager-dynamic-registration-agent"
    bare: true
    base_import_paths: true
    preserve_import_paths: false
    repositories:
      - ghcr.io/spiffe/spire-controller-manager-dynamic-registration-agent
    tags:
      - "{{.Version}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
  - repositories:
      - ghcr.io/spiffe/spire-controller-manager-dynamic-registration-server
    id: "spire-controller-manager-dynamic-registration-server"
    build: "spire-controller-manager-dynamic-registration-server"
    bare: true
    base_import_paths: true
    preserve_import_paths: false
    tags:
      - "{{.Version}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
